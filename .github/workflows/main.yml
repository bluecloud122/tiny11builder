name: Build Windows Prime-like ISO

on:
  push:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct HTTPS URL for the official Microsoft Windows 11 ISO"
        required: true
        default: "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26200.6584.250915-1905.25h2_ge_release_svc_refresh_CLIENT_CONSUMER_x64FRE_en-us.iso"
        type: string
      iso_sha256:
        description: "SHA-256 of the ISO, copied from Microsoft's download information"
        required: true
        default: "768984706B909479417B2368438909440F2967FF05C6A9195ED2667254E465E3"
        type: string
      edition:
        description: "Edition to keep in the final image"
        required: true
        default: "Pro"
        type: choice
        options:
          - Home
          - Pro
          - Education
          - Enterprise
      low_ram:
        description: "Apply the 1 GB-class low-RAM profile"
        required: true
        default: true
        type: boolean
      profile:
        description: "Image profile: Regular is serviceable; Core is the smallest test image"
        required: true
        default: "Regular"
        type: choice
        options:
          - Regular
          - Core

permissions:
  contents: read

jobs:
  build:
    name: Build trimmed Windows 11 image
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Free Disk Space on Runner
        shell: powershell
        run: |
          Write-Host "Freeing up disk space on C: drive..."
          Get-ChildItem -Path C:\Android, C:\hostedtoolcache\Java, C:\hostedtoolcache\Ruby, C:\hostedtoolcache\Go -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Disk space freed successfully."

      - name: Check out this workflow
        uses: actions/checkout@v4

      - name: Check out the builder revision
        uses: actions/checkout@v4
        with:
          repository: bluecloud122/tiny11builder
          ref: ${{ github.sha }}
          path: tiny11builder
          fetch-depth: 1

      - name: Verify builder source
        shell: powershell
        run: |
          $requiredFiles = @(
            "tiny11builder\tiny11maker.ps1",
            "tiny11builder\tiny11Coremaker.ps1",
            "tiny11builder\autounattend.xml"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Warning "File missing: $file"
            }
          }

      # -------------------------------------------------------------
      # 🚀 نظام التخزين المؤقت (ISO Cache) لتجنب التحميل في كل مرة
      # -------------------------------------------------------------
      - name: Cache Windows ISO
        id: cache-iso
        uses: actions/cache@v4
        with:
          path: D:/a/_temp/Windows11.iso
          key: win11-iso-${{ inputs.iso_sha256 }}

      - name: Download and verify official Microsoft ISO (Only if Cache Missed)
        if: steps.cache-iso.outputs.cache-hit != 'true'
        shell: powershell
        env:
          ISO_URL: ${{ inputs.iso_url }}
          ISO_SHA256: ${{ inputs.iso_sha256 }}
        run: |
          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11.iso"
          Write-Host "Downloading ISO from Microsoft..."

          curl.exe --fail `
            --location `
            -C - `
            --retry 10 `
            --retry-all-errors `
            --retry-delay 5 `
            --connect-timeout 60 `
            --output $isoPath `
            $env:ISO_URL

          if ($LASTEXITCODE -ne 0) {
            throw "Download failed with exit code $LASTEXITCODE."
          }

          if ($env:ISO_SHA256) {
            $expectedHash = ($env:ISO_SHA256 -replace "\s", "").ToUpperInvariant()
            $actualHash = (Get-FileHash $isoPath -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($actualHash -ne $expectedHash) {
              Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
              throw "ISO SHA-256 mismatch. Expected $expectedHash, got $actualHash."
            }
            Write-Host "ISO SHA-256 verified successfully."
          }

      - name: Select edition and prepare compatibility improvements (Fully Flexible)
        shell: powershell
        env:
          TARGET_EDITION: ${{ inputs.edition }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11.iso"
          
          # 1. التقاط الأقراص الموجودة بالنظام قبل الـ Mount
          $beforeDrives = Get-PSDrive -PSProvider FileSystem | Select-Object -ExpandProperty Name
          
          Write-Host "Mounting ISO dynamically..."
          Mount-DiskImage -ImagePath $isoPath -ErrorAction SilentlyContinue | Out-Null
          Start-Sleep -Seconds 5

          # 2. جلب الحرف المخصص للـ ISO مع استبعاد قرص C
          $afterDrives = Get-PSDrive -PSProvider FileSystem | Select-Object -ExpandProperty Name
          $newDrive = ($afterDrives | Where-Object { $beforeDrives -notcontains $_ -and $_ -ne 'C' }) | Select-Object -First 1

          if (-not $newDrive) {
            $newDrive = (Get-Volume | Where-Object { $_.DriveType -eq 'CD-ROM' -and $_.DriveLetter -and $_.DriveLetter -ne 'C' } | Select-Object -First 1).DriveLetter
          }

          if (-not $newDrive) {
            $newDrive = (Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -ne 'C' -and (Test-Path "$($_.Name):\sources") } | Select-Object -First 1).Name
          }

          if (-not $newDrive) {
            throw "Dynamic Drive Detection Failed: Could not identify mounted ISO drive."
          }

          $mediaDrive = "$newDrive`:"
          Write-Host "Detected ISO Drive: $mediaDrive"

          # 3. التأكد من ملف الصورة
          $imagePath = Get-ChildItem -Path "$mediaDrive\sources" -Include "install.wim", "install.esd" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1

          if (-not $imagePath) {
            throw "No valid install.wim or install.esd found in $mediaDrive"
          }

          # 4. تحديد الإصدار المطلوب (Edition)
          $images = @(Get-WindowsImage -ImagePath $imagePath)
          $selected = $images | Where-Object {
            $_.ImageName -like "*$env:TARGET_EDITION*" -or
            $_.ImageDescription -like "*$env:TARGET_EDITION*"
          } | Select-Object -First 1

          if (-not $selected) {
            Write-Warning "Target edition '$env:TARGET_EDITION' not strictly matched. Defaulting to first available image index."
            $selected = $images[0]
          }

          $env:TINY11_IMAGE_INDEX = [string]$selected.ImageIndex
          $env:TINY11_MEDIA_DRIVE = $mediaDrive
          Write-Host "Selected Image Index: $env:TINY11_IMAGE_INDEX ($($selected.ImageName))"

          # 5. تعديل السكريبتات وتمرير الحرف ورقم الإصدار بدون أسئلة تفاعلية
          $makerPath = Join-Path $PWD "tiny11builder\tiny11maker.ps1"
          if (Test-Path $makerPath) {
            $content = Get-Content $makerPath -Raw
            $content = [Regex]::Replace($content, '(\$driveLetter\s*=\s*)Read-Host[^\r\n]*', "`$1 `"$env:TINY11_MEDIA_DRIVE`"")
            $content = [Regex]::Replace($content, '(\$index\s*=\s*)Read-Host[^\r\n]*', "`$1 [int]$env:TINY11_IMAGE_INDEX")
            $content = [Regex]::Replace($content, 'C:\\scratchdir', '$mainOSDrive\scratchdir')
            $content = [Regex]::Replace($content, 'Read-Host[^\r\n]*', '"y"')
            Set-Content -Path $makerPath -Value $content -Encoding UTF8
          }

          $corePath = Join-Path $PWD "tiny11builder\tiny11Coremaker.ps1"
          if (Test-Path $corePath) {
            $content = Get-Content $corePath -Raw
            $content = [Regex]::Replace($content, '(\$DriveLetter\s*=\s*)Read-Host[^\r\n]*', "`$1 `"$env:TINY11_MEDIA_DRIVE`"")
            $content = [Regex]::Replace($content, '(\$index\s*=\s*)Read-Host[^\r\n]*', "`$1 [int]$env:TINY11_IMAGE_INDEX")
            $content = [Regex]::Replace($content, 'Read-Host[^\r\n]*', '"y"')
            Set-Content -Path $corePath -Value $content -Encoding UTF8
          }

          "TINY11_IMAGE_INDEX=$env:TINY11_IMAGE_INDEX" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TINY11_MEDIA_DRIVE=$env:TINY11_MEDIA_DRIVE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TINY11_LOW_RAM=${{ inputs.low_ram }}" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TINY11_PROFILE=$env:BUILD_PROFILE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the selected image profile
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          
          if ($env:TINY11_PROFILE -eq "Core") {
            Write-Host "Building Core Profile..."
            $builderPath = Join-Path $PWD "tiny11builder\tiny11Coremaker.ps1"
            & $builderPath
          } else {
            Write-Host "Building Regular Profile..."
            $builderPath = Join-Path $PWD "tiny11builder\tiny11maker.ps1"
            & $builderPath
          }

          $generatedIso = Get-ChildItem -Path $PWD -Filter "*.iso" -Recurse | Select-Object -First 1
          if (-not $generatedIso) {
            throw "Fatal: Build completed but no output ISO file was found."
          }
          Write-Host "ISO successfully generated at: $($generatedIso.FullName)"

      - name: Write build metadata
        shell: powershell
        run: |
          $iso = Get-ChildItem -Path $PWD -Filter "*.iso" -Recurse | Select-Object -First 1
          if ($iso) {
            $hash = (Get-FileHash $iso.FullName -Algorithm SHA256).Hash
            @"
            Builder commit: ${{ github.sha }}
            Edition: ${{ inputs.edition }}
            Profile: ${{ inputs.profile }}
            Output: $($iso.Name)
            Output SHA-256: $hash
            "@ | Set-Content "tiny11builder\tiny11-build-info.txt" -Encoding UTF8
          }

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-prime-like-iso
          path: |
            **/*.iso
            tiny11builder/tiny11-build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: Dismount source ISO safely
        if: always()
        shell: powershell
        run: |
          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11.iso"
          if (Test-Path $isoPath) {
            Dismount-DiskImage -ImagePath $isoPath -ErrorAction SilentlyContinue
          }
