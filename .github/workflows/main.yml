name: Build Windows Prime-like ISO

on:
  push:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct HTTPS URL for the official Microsoft Windows 11 ISO"
        required: false
        default: "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26200.6584.250915-1905.25h2_ge_release_svc_refresh_CLIENT_CONSUMER_x64FRE_en-us.iso"
        type: string
      iso_sha256:
        description: "SHA-256 of the ISO, copied from Microsoft's download information"
        required: false
        default: "D141F6030FED50F75E2B03E1EB2E53646C4B21E5386047CB860AF5223F102A32"
        type: string
      edition:
        description: "Edition to keep in the final image"
        required: true
        default: "Pro"
        type: choice
        options:
          - Home
          - Pro
          - Education
          - Enterprise
      low_ram:
        description: "Apply the 1 GB-class low-RAM profile"
        required: true
        default: true
        type: boolean
      profile:
        description: "Image profile: Regular is serviceable; Core is the smallest test image"
        required: true
        default: "Regular"
        type: choice
        options:
          - Regular
          - Core

permissions:
  contents: read

jobs:
  build:
    name: Build trimmed Windows 11 image
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Free Disk Space on Runner
        shell: powershell
        run: |
          Write-Host "Freeing up disk space on C: drive..."
          Get-ChildItem -Path C:\Android, C:\hostedtoolcache\Java, C:\hostedtoolcache\Ruby, C:\hostedtoolcache\Go -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Disk space freed successfully."

      - name: Check out this workflow
        uses: actions/checkout@v4

      - name: Check out the builder revision
        uses: actions/checkout@v4
        with:
          repository: bluecloud122/tiny11builder
          ref: ${{ github.sha }}
          path: tiny11builder
          fetch-depth: 1

      - name: Verify builder source
        shell: powershell
        run: |
          $requiredFiles = @(
            "tiny11builder\tiny11maker.ps1",
            "tiny11builder\tiny11Coremaker.ps1",
            "tiny11builder\autounattend.xml"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Warning "File missing: $file"
            }
          }

      # -------------------------------------------------------------
      # 🚀 نظام التخزين المؤقت المحدث مع الـ SHA256 الصحيح
      # -------------------------------------------------------------
      - name: Cache Windows ISO
        id: cache-iso
        uses: actions/cache@v4
        with:
          path: D:/a/_temp/Windows11.iso
          key: win11-iso-D141F6030FED50F75E2B03E1EB2E53646C4B21E5386047CB860AF5223F102A32

      - name: Download and verify official Microsoft ISO (Only if Cache Missed)
        if: steps.cache-iso.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11.iso"
          
          $defaultUrl = "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26200.6584.250915-1905.25h2_ge_release_svc_refresh_CLIENT_CONSUMER_x64FRE_en-us.iso"
          $defaultHash = "D141F6030FED50F75E2B03E1EB2E53646C4B21E5386047CB860AF5223F102A32"

          $inputUrl = "${{ inputs.iso_url }}"
          $inputHash = "${{ inputs.iso_sha256 }}"

          $downloadUrl = if ([string]::IsNullOrWhiteSpace($inputUrl)) { $defaultUrl } else { $inputUrl }
          $expectedHash = if ([string]::IsNullOrWhiteSpace($inputHash)) { $defaultHash } else { $inputHash }

          Write-Host "Downloading ISO from Microsoft..."
          Write-Host "Target URL: $downloadUrl"

          curl.exe --fail --location -C - --retry 10 --retry-all-errors --retry-delay 5 --connect-timeout 60 --output $isoPath "$downloadUrl"

          if ($LASTEXITCODE -ne 0) {
            throw "Download failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path $isoPath)) {
            throw "Download finished but ISO file was not found at $isoPath"
          }

          if ($expectedHash) {
            $cleanExpected = ($expectedHash -replace "\s", "").ToUpperInvariant()
            Write-Host "Verifying ISO Hash..."
            $actualHash = (Get-FileHash $isoPath -Algorithm SHA256).Hash.ToUpperInvariant()
            
            if ($actualHash -ne $cleanExpected) {
              Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
              throw "ISO SHA-256 mismatch! Expected $cleanExpected, got $actualHash."
            }
            Write-Host "ISO SHA-256 verified successfully."
          }

      - name: Select edition and prepare compatibility improvements (Fully Flexible)
        shell: powershell
        env:
          TARGET_EDITION: ${{ inputs.edition }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11.iso"
          if (-not (Test-Path -LiteralPath $isoPath)) {
            throw "Windows ISO was not found at $isoPath"
          }

          Write-Host "Mounting ISO dynamically..."
          $beforeLetters = @(Get-PSDrive -PSProvider FileSystem | Select-Object -ExpandProperty Name)
          Mount-DiskImage -ImagePath $isoPath -PassThru -ErrorAction Stop | Out-Null
          Start-Sleep -Seconds 5

          # Do not trust Get-DiskImage|Get-Volume here: hosted runners can return C:.
          # Select only a newly visible/cdrom drive that actually contains Windows media.
          $afterLetters = @(Get-PSDrive -PSProvider FileSystem | Select-Object -ExpandProperty Name)
          $candidates = @()
          $candidates += @($afterLetters | Where-Object { $beforeLetters -notcontains $_ -and $_ -ne "C" })
          $candidates += @((Get-Volume |
            Where-Object { $_.DriveType -eq "CD-ROM" -and $_.DriveLetter -and $_.DriveLetter -ne "C" } |
            Select-Object -ExpandProperty DriveLetter))

          $mediaDriveLetter = $null
          foreach ($candidate in $candidates) {
            $letter = ([string]$candidate).Trim().TrimEnd(":")
            if ($letter.Length -ne 1) { continue }
            $letter = $letter.Substring(0, 1).ToUpperInvariant()
            $candidateRoot = $letter + ":\\"
            if ((Test-Path -LiteralPath (Join-Path $candidateRoot "sources\install.wim")) -or
                (Test-Path -LiteralPath (Join-Path $candidateRoot "sources\install.esd"))) {
              $mediaDriveLetter = $letter
              break
            }
          }

          if (-not $mediaDriveLetter) {
            Write-Host "Drive candidates: $($candidates -join ', ')"
            throw "Could not find a mounted ISO drive containing sources\install.wim or sources\install.esd."
          }

          $mediaDrive = $mediaDriveLetter + ":\\"
          Write-Host "Detected ISO Drive: $mediaDrive"

          $imagePath = @(
            (Join-Path $mediaDrive "sources\install.wim"),
            (Join-Path $mediaDrive "sources\install.esd")
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          $images = @(Get-WindowsImage -ImagePath $imagePath -ErrorAction Stop)
          if ($images.Count -eq 0) {
            throw "No Windows images were found in $imagePath"
          }

          $targetEdition = $env:TARGET_EDITION
          if ([string]::IsNullOrWhiteSpace($targetEdition)) {
            $targetEdition = "Pro"
          }
          $selected = $images | Where-Object {
            $_.ImageName -like "*$targetEdition*" -or
            $_.ImageDescription -like "*$targetEdition*"
          } | Select-Object -First 1

          if (-not $selected) {
            Write-Warning "Target edition '$targetEdition' was not strictly matched. Using image index 1."
            $selected = $images | Select-Object -First 1
          }

          $env:TINY11_IMAGE_INDEX = [string]$selected.ImageIndex
          $env:TINY11_MEDIA_DRIVE = $mediaDriveLetter
          Write-Host "Selected Image Index: $env:TINY11_IMAGE_INDEX ($($selected.ImageName))"

          # Make the checked-out builders non-interactive without changing their source repository.
          $builderFiles = @(
            (Join-Path $PWD "tiny11builder\tiny11maker.ps1"),
            (Join-Path $PWD "tiny11builder\tiny11Coremaker.ps1")
          )
          foreach ($builderFile in $builderFiles) {
            if (-not (Test-Path -LiteralPath $builderFile)) {
              throw "Builder script not found: $builderFile"
            }
            $content = Get-Content -LiteralPath $builderFile -Raw
            $content = $content.Replace('$DriveLetter = Read-Host "Please enter the drive letter for the Windows 11 image"', '$DriveLetter = $env:TINY11_MEDIA_DRIVE')
            $content = $content.Replace('$index = Read-Host "Please enter the image index"', '$index = [int]$env:TINY11_IMAGE_INDEX')
            $content = $content.Replace('$input = Read-Host', '$input = "y"')
            $content = [regex]::Replace($content, 'Read-Host[^\r\n]*', '"y"')
            Set-Content -LiteralPath $builderFile -Value $content -Encoding UTF8
          }

          $requestedLowRam = "${{ inputs.low_ram }}"
          $requestedProfile = "${{ inputs.profile }}"
          $lowRam = if ([string]::IsNullOrWhiteSpace($requestedLowRam)) { "false" } else { $requestedLowRam }
          $profile = if ([string]::IsNullOrWhiteSpace($requestedProfile)) { "Regular" } else { $requestedProfile }
          "TINY11_IMAGE_INDEX=$env:TINY11_IMAGE_INDEX" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TINY11_MEDIA_DRIVE=$env:TINY11_MEDIA_DRIVE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TINY11_LOW_RAM=$lowRam" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TINY11_PROFILE=$profile" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the selected image profile
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          
          if ($env:TINY11_PROFILE -eq "Core") {
            Write-Host "Building Core Profile..."
            $builderPath = Join-Path $PWD "tiny11builder\tiny11Coremaker.ps1"
            & $builderPath
          } else {
            Write-Host "Building Regular Profile..."
            $builderPath = Join-Path $PWD "tiny11builder\tiny11maker.ps1"
            & $builderPath
          }

          $generatedIso = Get-ChildItem -Path $PWD -Filter "*.iso" -Recurse | Select-Object -First 1
          if (-not $generatedIso) {
            throw "Fatal: Build completed but no output ISO file was found."
          }
          Write-Host "ISO successfully generated at: $($generatedIso.FullName)"

      - name: Write build metadata
        shell: powershell
        run: |
          $iso = Get-ChildItem -Path $PWD -Filter "*.iso" -Recurse | Select-Object -First 1
          if ($iso) {
            $hash = (Get-FileHash $iso.FullName -Algorithm SHA256).Hash
            @"
            Builder commit: ${{ github.sha }}
            Edition: ${{ inputs.edition }}
            Profile: ${{ inputs.profile }}
            Output: $($iso.Name)
            Output SHA-256: $hash
            "@ | Set-Content "tiny11builder\tiny11-build-info.txt" -Encoding UTF8
          }

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-prime-like-iso
          path: |
            **/*.iso
            tiny11builder/tiny11-build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: Dismount source ISO safely
        if: always()
        shell: powershell
        run: |
          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11.iso"
          if (Test-Path $isoPath) {
            Dismount-DiskImage -ImagePath $isoPath -ErrorAction SilentlyContinue
          }
