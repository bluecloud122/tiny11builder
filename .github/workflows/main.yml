name: Build Windows Prime-like ISO

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "Direct HTTPS URL for the official Microsoft Windows 11 ISO"
        required: true
        default: "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26200.6584.250915-1905.25h2_ge_release_svc_refresh_CLIENT_CONSUMER_x64FRE_en-us.iso"
        type: string
      iso_sha256:
        description: "SHA-256 of the ISO, copied from Microsoft's download information"
        required: true
        default: "768984706B909479417B2368438909440F2967FF05C6A9195ED2667254E465E3"
        type: string
      edition:
        description: "Edition to keep in the final image"
        required: true
        default: "Pro"
        type: choice
        options:
          - Home
          - Pro
          - Education
          - Enterprise
      low_ram:
        description: "Apply the 1 GB-class low-RAM profile"
        required: true
        default: true
        type: boolean
      profile:
        description: "Image profile: Regular is serviceable; Core is the smallest test image"
        required: true
        default: "Regular"
        type: choice
        options:
          - Regular
          - Core

permissions:
  contents: read

jobs:
  build:
    name: Build trimmed Windows 11 image
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Free Disk Space on Runner
        shell: powershell
        run: |
          Write-Host "Freeing up disk space on C: drive..."
          Get-ChildItem -Path C:\Android, C:\hostedtoolcache\Java, C:\hostedtoolcache\Ruby, C:\hostedtoolcache\Go -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Disk space freed successfully."

      - name: Check out this workflow
        uses: actions/checkout@v4

      # Build the exact revision that triggered this workflow, including local
      # compatibility changes, instead of silently using an older pinned copy.
      - name: Check out the builder revision
        uses: actions/checkout@v4
        with:
          repository: bluecloud122/tiny11builder
          ref: ${{ github.sha }}
          path: tiny11builder
          fetch-depth: 1

      - name: Verify builder source
        shell: powershell
        run: |
          $expectedCommit = "${{ github.sha }}"
          $actualCommit = (git -C tiny11builder rev-parse HEAD).Trim()
          if ($actualCommit -ne $expectedCommit) {
            throw "The tiny11builder checkout did not match the workflow revision."
          }

          $requiredFiles = @(
            "tiny11builder\tiny11maker.ps1",
            "tiny11builder\tiny11Coremaker.ps1",
            "tiny11builder\autounattend.xml"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required builder file is missing: $file"
            }
          }

          $builderHash = (Get-FileHash "tiny11builder\tiny11maker.ps1" -Algorithm SHA256).Hash
          Write-Host "Verified tiny11maker.ps1 SHA-256: $builderHash"

      - name: Download and verify official Microsoft ISO
        shell: powershell
        env:
          ISO_URL: ${{ inputs.iso_url }}
          ISO_SHA256: ${{ inputs.iso_sha256 }}
        run: |
          $uri = [Uri]$env:ISO_URL
          $trustedHosts = @(
            "download.microsoft.com",
            "software.download.prss.microsoft.com",
            "software-static.download.prss.microsoft.com",
            "software-download.microsoft.com"
          )

          if ($uri.Scheme -ne "https") {
            throw "The ISO URL must use HTTPS."
          }
          if ($trustedHosts -notcontains $uri.DnsSafeHost.ToLowerInvariant()) {
            throw "Refusing to download from an untrusted host: $($uri.DnsSafeHost). Use a direct Microsoft ISO URL."
          }

          $expectedHash = ($env:ISO_SHA256 -replace "\s", "").ToUpperInvariant()
          if ($expectedHash -notmatch "^[A-F0-9]{64}$") {
            throw "iso_sha256 must be exactly 64 hexadecimal characters."
          }

          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11.iso"
          Write-Host "Downloading the official ISO from $($uri.DnsSafeHost)..."

          # تشغيل curl المباشر مع تفعيل الاستئناف التلقائي (-C -) وإعادة المحاولة
          curl.exe --fail `
            --location `
            -C - `
            --retry 10 `
            --retry-all-errors `
            --retry-delay 5 `
            --connect-timeout 60 `
            --output $isoPath `
            $env:ISO_URL

          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "curl.exe failed to download the ISO with exit code $exitCode."
          }

          Write-Host "Verifying ISO SHA-256..."
          $actualHash = (Get-FileHash $isoPath -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -ne $expectedHash) {
            Remove-Item $isoPath -Force -ErrorAction SilentlyContinue
            throw "ISO SHA-256 mismatch. Expected $expectedHash, got $actualHash."
          }
          Write-Host "ISO SHA-256 verified: $actualHash"

      - name: Select edition and prepare compatibility improvements
        shell: powershell
        env:
          TARGET_EDITION: ${{ inputs.edition }}
          BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11.iso"
          Mount-DiskImage -ImagePath $isoPath | Out-Null
          Start-Sleep -Seconds 3
          $drive = (
            Get-DiskImage -ImagePath $isoPath |
              Get-Disk |
              Get-Partition |
              Get-Volume |
              Where-Object DriveLetter |
              Select-Object -First 1
          ).DriveLetter
          if (-not $drive) {
            throw "Windows could not assign a drive letter to the ISO."
          }

          $mediaDrive = "$drive`:"
          $requiredBootFiles = @(
            (Join-Path $mediaDrive "boot\etfsboot.com"),
            (Join-Path $mediaDrive "efi\microsoft\boot\efisys.bin")
          )
          foreach ($bootFile in $requiredBootFiles) {
            if (-not (Test-Path $bootFile)) {
              throw "The source ISO is missing a required BIOS/UEFI boot file: $bootFile"
            }
          }
          Write-Host "Verified legacy BIOS and UEFI boot files in the source ISO."

          $wimPath = Join-Path $mediaDrive "sources\install.wim"
          $esdPath = Join-Path $mediaDrive "sources\install.esd"
          if (Test-Path $wimPath) {
            $imagePath = $wimPath
          } elseif (Test-Path $esdPath) {
            $imagePath = $esdPath
          } else {
            throw "The mounted ISO has no install.wim or install.esd."
          }

          $images = @(Get-WindowsImage -ImagePath $imagePath)
          $selected = $images | Where-Object {
            $_.ImageName -match [Regex]::Escape($env:TARGET_EDITION) -or
            $_.ImageDescription -match [Regex]::Escape($env:TARGET_EDITION)
          } | Select-Object -First 1

          if (-not $selected) {
            $available = ($images | ForEach-Object { "$($_.ImageIndex): $($_.ImageName)" }) -join "; "
            throw "Edition '$env:TARGET_EDITION' was not found. Available images: $available"
          }

          $env:TINY11_IMAGE_INDEX = [string]$selected.ImageIndex
          $env:TINY11_MEDIA_DRIVE = $drive
          Write-Host "Selected image index $env:TINY11_IMAGE_INDEX`: $($selected.ImageName)"

          $makerPath = Join-Path $PWD "tiny11builder\tiny11maker.ps1"
          $makerContent = Get-Content $makerPath -Raw
          $makerContent = $makerContent.Replace(
            '$index = Read-Host "Please enter the image index"',
            '$index = [int]$env:TINY11_IMAGE_INDEX'
          )
          $makerContent = $makerContent.Replace(
            '$tasksPath = "C:\scratchdir\Windows\System32\Tasks"',
            '$tasksPath = "$mainOSDrive\scratchdir\Windows\System32\Tasks"'
          )
          Set-Content -Path $makerPath -Value $makerContent -Encoding UTF8

          $corePath = Join-Path $PWD "tiny11builder\tiny11Coremaker.ps1"
          $coreContent = Get-Content $corePath -Raw
          $coreContent = $coreContent.Replace(
            '$DriveLetter = Read-Host "Please enter the drive letter for the Windows 11 image"',
            '$DriveLetter = $env:TINY11_MEDIA_DRIVE'
          )
          $coreContent = $coreContent.Replace(
            '$index = Read-Host "Please enter the image index"',
            '$index = [int]$env:TINY11_IMAGE_INDEX'
          )
          $coreContent = $coreContent.Replace(
            '$mainOSDrive = $env:SystemDrive',
            '$mainOSDrive = $env:SystemDrive' + [Environment]::NewLine +
            '$ScratchDisk = $mainOSDrive'
          )
          $coreContent = [Regex]::Replace(
            $coreContent,
            'Write-Host "Do you want to continue\? \(y/n\)"\s*\$input = Read-Host',
            'Write-Host "CI mode: continuing with the selected Core image."' + [Environment]::NewLine +
            '$input = "y"'
          )
          $coreContent = [Regex]::Replace(
            $coreContent,
            'Write-Host "Do you want to enable \.NET 3\.5\? This cannot be done after the image has been created! \(y/n\)"\s*\$input = Read-Host',
            'Write-Host "CI mode: leaving .NET 3.5 disabled for the smallest image."' + [Environment]::NewLine +
            '$input = "n"'
          )
          $coreContent = [Regex]::Replace(
            $coreContent,
            'Write-Host "Creation completed! Press any key to exit the script\.\.\."\s*\r?\nRead-Host "Press Enter to continue"',
            'Write-Host "Creation completed."'
          )
          Set-Content -Path $corePath -Value $coreContent -Encoding UTF8

          "TINY11_IMAGE_INDEX=$env:TINY11_IMAGE_INDEX" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TINY11_MEDIA_DRIVE=$env:TINY11_MEDIA_DRIVE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TINY11_LOW_RAM=${{ inputs.low_ram }}" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TINY11_PROFILE=$env:BUILD_PROFILE" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the selected image profile
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          if ($env:TINY11_PROFILE -eq "Core") {
            Write-Host "Building the Core profile: smallest output, not serviceable after creation."
            $builderPath = Join-Path $PWD "tiny11builder\tiny11Coremaker.ps1"
            $builderArgs = @()
            if ($env:TINY11_LOW_RAM -eq "true") {
              $builderArgs += "-LOWRAM"
            }
            & $builderPath @builderArgs
          } else {
            Write-Host "Building the Regular profile: serviceable image with low-RAM tuning."
            $builderPath = Join-Path $PWD "tiny11builder\tiny11maker.ps1"
            $builderArgs = @("-ISO", $env:TINY11_MEDIA_DRIVE, "-SCRATCH", "D")
            if ($env:TINY11_LOW_RAM -eq "true") {
              $builderArgs += "-LOWRAM"
            }
            & $builderPath @builderArgs
          }
          if ($LASTEXITCODE -ne 0) {
            throw "$env:TINY11_PROFILE builder failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path "tiny11builder\tiny11.iso")) {
            throw "The build finished without creating tiny11.iso."
          }

      - name: Write build metadata
        shell: powershell
        run: |
          $iso = Get-Item "tiny11builder\tiny11.iso"
          $hash = (Get-FileHash $iso.FullName -Algorithm SHA256).Hash
          @"
          Builder commit: ${{ github.sha }}
          Edition: ${{ inputs.edition }}
          Profile: ${{ inputs.profile }}
          Low-RAM profile: ${{ inputs.low_ram }}
          Boot modes: Legacy BIOS and UEFI (dual El Torito entries)
          Output: $($iso.Name)
          Output SHA-256: $hash
          Note: This image bypasses Windows 11 hardware checks for unsupported older CPUs.
          It does not activate Windows and remains subject to Microsoft's license terms.
          "@ | Set-Content "tiny11builder\tiny11-build-info.txt" -Encoding UTF8

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: windows-prime-like-iso
          path: |
            tiny11builder/tiny11.iso
            tiny11builder/tiny11-build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: Dismount source ISO
        if: always()
        shell: powershell
        run: |
          $isoPath = Join-Path $env:RUNNER_TEMP "Windows11.iso"
          if (Test-Path $isoPath) {
            Dismount-DiskImage -ImagePath $isoPath -ErrorAction SilentlyContinue
          }
