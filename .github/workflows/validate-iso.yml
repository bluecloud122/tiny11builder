name: Validate built Tiny11 ISO

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  boot-test:
    name: Boot-test ISO in a 5th-gen Intel-like ${{ matrix.firmware }} VM
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        firmware:
          - bios
          - uefi

    steps:
      - name: Download ISO directly from GitHub API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          
          echo "Downloading artifact from GitHub API..."
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o input/artifact.zip \
            "https://api.github.com/repos/bluecloud122/tiny11builder/actions/artifacts/9192733079/zip"

          if [[ -f input/artifact.zip ]]; then
            echo "Unzipping downloaded artifact..."
            unzip -o input/artifact.zip -d input/
            rm input/artifact.zip
          fi

      - name: Locate and hash the ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-output

          mapfile -t iso_files < <(find input -type f -iname '*.iso' -print)
          if [[ "${#iso_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one ISO, found %s:\n' "${#iso_files[@]}" >&2
            printf '  %s\n' "${iso_files[@]-}" >&2
            exit 1
          fi

          ISO_PATH="${iso_files[0]}"
          ISO_SIZE="$(stat -c '%s' "$ISO_PATH")"
          if [[ "$ISO_SIZE" -lt 1048576 ]]; then
            echo "The downloaded ISO is unexpectedly small: ${ISO_SIZE} bytes." >&2
            exit 1
          fi

          printf 'ISO path: %s\nISO size: %s bytes\n' "$ISO_PATH" "$ISO_SIZE" \
            | tee validation-output/input-info.txt
          sha256sum "$ISO_PATH" | tee validation-output/input-sha256.txt
          printf 'ISO_PATH=%s\n' "$ISO_PATH" >> "$GITHUB_ENV"

      - name: Install QEMU and screenshot tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            imagemagick \
            ovmf \
            qemu-system-x86 \
            qemu-utils \
            socat \
            tesseract-ocr \
            unzip \
            xorriso

      - name: Boot-test ISO and capture screenshots
        id: vm-test
        shell: bash
        env:
          VM_CPU_MODEL: Broadwell
          VM_MEMORY_MB: "4096"
          VM_VCPUS: "2"
          VM_FIRMWARE: ${{ matrix.firmware }}
        run: |
          set -Eeuo pipefail

          REPORT_DIR="$GITHUB_WORKSPACE/validation-output"
          DISK_IMAGE="$RUNNER_TEMP/tiny11-validation-${VM_FIRMWARE}.qcow2"
          OVMF_VARS="$RUNNER_TEMP/OVMF_VARS-${VM_FIRMWARE}.fd"
          MONITOR_SOCKET="$RUNNER_TEMP/tiny11-qemu-monitor-${VM_FIRMWARE}.sock"
          SERIAL_LOG="$REPORT_DIR/qemu-serial.log"
          SUMMARY="$REPORT_DIR/validation-summary.md"

          mkdir -p "$REPORT_DIR"
          FIRMWARE_ARGS=()
          MACHINE_ARGS=( -machine pc )
          ISO_BOOT_REPORT="$REPORT_DIR/iso-boot-report.txt"

          # Record the El Torito boot catalog before launching QEMU. This makes
          # a missing UEFI entry fail explicitly instead of falling through to
          # the OVMF shell and being reported as a false PASS.
          xorriso -indev "$ISO_PATH" -report_el_torito plain \
            > "$ISO_BOOT_REPORT" 2>&1 || {
              echo "Could not inspect the ISO El Torito boot catalog." >&2
              cat "$ISO_BOOT_REPORT" >&2
              exit 1
          }

          if [[ "$VM_FIRMWARE" == "uefi" ]]; then
            OVMF_DIR="/usr/share/OVMF"
            if [[ -f "$OVMF_DIR/OVMF_CODE_4M.fd" && -f "$OVMF_DIR/OVMF_VARS_4M.fd" ]]; then
              OVMF_CODE="$OVMF_DIR/OVMF_CODE_4M.fd"
              OVMF_VARS_TEMPLATE="$OVMF_DIR/OVMF_VARS_4M.fd"
            elif [[ -f "$OVMF_DIR/OVMF_CODE.fd" && -f "$OVMF_DIR/OVMF_VARS.fd" ]]; then
              OVMF_CODE="$OVMF_DIR/OVMF_CODE.fd"
              OVMF_VARS_TEMPLATE="$OVMF_DIR/OVMF_VARS.fd"
            else
              echo "Could not find a matching OVMF CODE/VARS firmware pair." >&2
              exit 1
            fi

            if ! grep -Eiq 'efi|efisys|bootx64' "$ISO_BOOT_REPORT"; then
              echo "The ISO El Torito catalog has no detectable UEFI boot entry." >&2
              cat "$ISO_BOOT_REPORT" >&2
              exit 1
            fi

            # q35 is the modern chipset path used by OVMF/Windows guests.
            # Keep legacy pc/SeaBIOS for the separate BIOS compatibility test.
            MACHINE_ARGS=( -machine q35 )
            cp --reflink=auto "$OVMF_VARS_TEMPLATE" "$OVMF_VARS"
            FIRMWARE_ARGS=(
              -drive "if=pflash,format=raw,readonly=on,file=$OVMF_CODE"
              -drive "if=pflash,format=raw,file=$OVMF_VARS"
            )
            FIRMWARE_NAME="UEFI"
          else
            FIRMWARE_NAME="SeaBIOS legacy BIOS"
          fi

          qemu-img create -f qcow2 "$DISK_IMAGE" 32G

          if [[ -e /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            ACCELERATION=( -accel kvm )
            ACCELERATION_NAME="KVM"
          else
            ACCELERATION=( -accel tcg,thread=multi )
            ACCELERATION_NAME="QEMU TCG software emulation"
          fi

          cat > "$SUMMARY" <<EOF
          # Tiny11 ISO boot validation

          - Firmware: $FIRMWARE_NAME
          - Source ISO: Downloaded via artifact ID 9192733079
          - VM CPU model: \`$VM_CPU_MODEL\` (Broadwell-class)
          - VM memory: ${VM_MEMORY_MB} MiB
          - VM vCPUs: $VM_VCPUS
          - Acceleration: $ACCELERATION_NAME
          - Guest disk: 32 GiB dynamically allocated QCOW2
          EOF

          cleanup() {
            if [[ -n "${QEMU_PID:-}" ]] && kill -0 "$QEMU_PID" 2>/dev/null; then
              printf 'quit\n' | socat - "UNIX-CONNECT:$MONITOR_SOCKET" >/dev/null 2>&1 || true
              kill "$QEMU_PID" 2>/dev/null || true
              wait "$QEMU_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          qemu-system-x86_64 \
            -name "tiny11-iso-validation-$VM_FIRMWARE" \
            "${MACHINE_ARGS[@]}" \
            "${ACCELERATION[@]}" \
            -cpu "$VM_CPU_MODEL" \
            -m "$VM_MEMORY_MB" \
            -smp "$VM_VCPUS" \
            "${FIRMWARE_ARGS[@]}" \
            -drive "file=$ISO_PATH,media=cdrom,readonly=on" \
            -drive "file=$DISK_IMAGE,if=ide,format=qcow2,media=disk" \
            -boot order=d,menu=on \
            -vga std \
            -display none \
            -monitor "unix:$MONITOR_SOCKET,server,nowait" \
            -serial "file:$SERIAL_LOG" \
            -no-reboot \
            > "$REPORT_DIR/qemu-console.log" 2>&1 &
          QEMU_PID=$!

          for _ in $(seq 1 30); do
            [[ -S "$MONITOR_SOCKET" ]] && break
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU exited before its monitor became ready." >&2
              exit 1
            fi
            sleep 1
          done
          [[ -S "$MONITOR_SOCKET" ]] || {
            echo "QEMU monitor socket did not become ready." >&2
            exit 1
          }

          capture_screen() {
            local label="$1"
            local ppm="$REPORT_DIR/${label}.ppm"
            local png="$REPORT_DIR/${label}.png"

            printf 'screendump %s\n' "$ppm" \
              | socat - "UNIX-CONNECT:$MONITOR_SOCKET"
            sleep 2
            [[ -s "$ppm" ]] || {
              echo "QEMU produced an empty screenshot for $label." >&2
              return 1
            }
            convert "$ppm" "$png"
            rm -f "$ppm"
            mean="$(identify -format '%[fx:mean]' "$png")"
            stddev="$(identify -format '%[fx:standard_deviation]' "$png")"
            identify "$png" | tee -a "$REPORT_DIR/screenshot-info.txt"
            printf 'mean=%s stddev=%s\n' "$mean" "$stddev" \
              | tee -a "$REPORT_DIR/screenshot-info.txt"

            # OCR is used only as a failure signal. It catches the exact
            # UEFI-shell/PXE state seen in the previous validation artifact.
            ocr_file="$REPORT_DIR/${label}.ocr.txt"
            tesseract "$png" stdout --psm 6 2>/dev/null \
              | tr '\n' ' ' > "$ocr_file" || true
            if grep -Eiq 'UEFI Interactive Shell|Shell>|PXE-E16|No bootable device|BdsDxe.*failed' \
              "$ocr_file" "$REPORT_DIR/qemu-console.log"; then
              echo "Detected a boot failure state in $label." >&2
              return 1
            fi

            # A live QEMU process can leave a completely black Windows frame
            # behind. Treat a near-empty final frame as a failed boot test.
            if [[ "$label" == *-03-install-final ]]; then
              if awk -v mean="$mean" -v stddev="$stddev" \
                'BEGIN { exit !((mean + 0) < 0.01 || (stddev + 0) < 0.01) }'; then
                echo "The final screenshot is effectively blank for $label." >&2
                return 1
              fi
            fi
          }

          start_time="$(date +%s)"
          for capture in "01-install-start:45" "02-install-progress:180" "03-install-final:420"; do
            label="${VM_FIRMWARE}-${capture%%:*}"
            target_seconds="${capture##*:}"
            elapsed="$(( $(date +%s) - start_time ))"
            remaining="$(( target_seconds - elapsed ))"
            if (( remaining > 0 )); then
              sleep "$remaining"
            fi

            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU exited before $label; the ISO did not remain bootable." >&2
              exit 1
            fi
            capture_screen "$label"
            echo "Captured $label."
          done

          cat >> "$SUMMARY" <<'EOF'

          ## Result

          **PASS — the guest produced non-empty final video output without a detected boot-failure state.**
          EOF

      - name: Upload ISO validation screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny11-iso-validation-manual-${{ matrix.firmware }}
          path: validation-output
          if-no-files-found: warn
          retention-days: 14
